name: Daily calendar update

on:
  schedule:
    # Every day at 00:10 UTC
    - cron: "10 0 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (current year)
        run: python forexfactory_scraper.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forexfactory_calendar.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update calendar ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
